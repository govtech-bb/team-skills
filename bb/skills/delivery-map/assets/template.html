  :root{
    --ground:#edf0f6; --surface:#ffffff; --surface-2:#f4f6fb;
    --ink:#00164a; --muted:#595959; --faint:#6b7688; --line:#e0e4e9;
    --accent:#0e5f64; --accent-ink:#0b4d51; --accent-soft:rgba(14,95,100,.12);
    --brand:#00267f; --brand-soft:rgba(0,38,127,.10);
    --done:#00654a; --done-soft:rgba(0,101,74,.12);
    --current:#8a5a00; --current-fill:#ffc726; --current-soft:rgba(232,168,51,.20);
    --pending:#9aa4b5; --pending-soft:rgba(154,164,181,.14);
    --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Consolas",monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0a1020; --surface:#101a2e; --surface-2:#16223c;
    --ink:#eaf0fa; --muted:#9fb0c8; --faint:#6f809a; --line:#24304a;
    --accent:#30c0c8; --accent-ink:#7fdfe4; --accent-soft:rgba(48,192,200,.15);
    --brand:#7d9be0; --brand-soft:rgba(125,155,224,.15);
    --done:#1fbf84; --done-soft:rgba(31,191,132,.16);
    --current:#ffc726; --current-fill:#ffc726; --current-soft:rgba(255,199,38,.16);
    --pending:#5d6a82; --pending-soft:rgba(93,106,130,.20);
  }}
  :root[data-theme="dark"]{
    --ground:#0a1020; --surface:#101a2e; --surface-2:#16223c;
    --ink:#eaf0fa; --muted:#9fb0c8; --faint:#6f809a; --line:#24304a;
    --accent:#30c0c8; --accent-ink:#7fdfe4; --accent-soft:rgba(48,192,200,.15);
    --brand:#7d9be0; --brand-soft:rgba(125,155,224,.15);
    --done:#1fbf84; --done-soft:rgba(31,191,132,.16);
    --current:#ffc726; --current-fill:#ffc726; --current-soft:rgba(255,199,38,.16);
    --pending:#5d6a82; --pending-soft:rgba(93,106,130,.20);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:clamp(1.5rem,4vw,3rem) 1.25rem 4rem}
  a{color:inherit}
  .mono{font-family:var(--mono)}

  .brand{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .brand h1{font-size:clamp(1.9rem,4.5vw,2.5rem);line-height:1.12;margin:0;letter-spacing:-.02em;font-weight:700}
  .eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.04em;color:var(--faint);text-transform:uppercase}

  .console{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--current-fill);border-radius:14px;padding:1.15rem 1.25rem;margin:1.1rem 0 2rem}
  .console .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem .8rem}
  .ref{font-family:var(--mono);font-size:.875rem;color:var(--brand);background:var(--brand-soft);padding:.2rem .5rem;border-radius:6px;text-decoration:none;font-weight:600}
  .svc{font-size:1.5rem;line-height:1.25;font-weight:700;letter-spacing:-.01em;flex:1 1 260px;min-width:0}
  .pill{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding:.2rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.live{color:var(--current);border-color:color-mix(in srgb,var(--current) 40%,transparent);background:var(--current-soft)}

  .meter{display:flex;gap:3px;margin:1rem 0 .7rem}
  .meter span{height:9px;flex:1;border-radius:2px;background:var(--pending-soft)}
  .meter span.done{background:var(--done)}
  .meter span.current{background:var(--current-fill)}
  .legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;font-size:.875rem;color:var(--muted)}
  .legend b{color:var(--ink);font-variant-numeric:tabular-nums}
  .key{display:inline-flex;align-items:center;gap:.4rem}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
  .sw-done{background:var(--done)} .sw-cur{background:var(--current-fill)} .sw-pend{background:var(--pending)}

  .focus{margin-top:.9rem;padding-top:.85rem;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:.5rem .9rem;font-size:1.0625rem}
  .focus dt{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);align-self:start;padding-top:.28rem}
  .focus dd{margin:0}
  .focus .gate{color:var(--current);font-weight:600}
  .src{margin-top:.8rem;font-family:var(--mono);font-size:.75rem;color:var(--faint)}

  .timing{display:flex;flex-wrap:wrap;gap:1.4rem;margin:.95rem 0 .1rem;padding:.7rem .9rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
  .timing .stat{display:flex;flex-direction:column;gap:.06rem;min-width:8.5rem}
  .timing .lab{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .timing .big{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .timing .sub{font-size:.875rem;color:var(--muted)}

  .phase{font-family:var(--mono);font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin:2rem 0 .3rem;display:flex;align-items:center;gap:.7rem}
  .phase::after{content:"";flex:1;height:1px;background:var(--line)}

  ol.line{list-style:none;margin:0;padding:0}
  li.stage{position:relative;display:grid;grid-template-columns:26px 1fr auto;gap:.2rem .9rem;padding:.7rem 0 .7rem}
  li.stage::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--line)}
  li.stage.done::before,li.stage.current::before{background:var(--accent)}
  li.stage:first-child::before{top:14px}
  li.stage:last-child::before{bottom:calc(100% - 14px)}
  .node{position:relative;z-index:1;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin-top:-1px}
  .node i{width:15px;height:15px;border-radius:50%;background:var(--surface);border:2px solid var(--pending);display:flex;align-items:center;justify-content:center}
  .done .node i{background:var(--done);border-color:var(--done)}
  .current .node i{background:var(--current-fill);border-color:var(--current-fill)}
  .node svg{width:9px;height:9px;color:#fff}
  .num{font-family:var(--mono);font-size:.66rem;color:var(--faint);position:absolute;left:-1.55rem;top:.85rem;width:1.2rem;text-align:right}

  .body h3{margin:0;font-size:1.25rem;line-height:1.3;font-weight:700;letter-spacing:-.01em}
  .why{margin:.15rem 0 0;font-size:.875rem;line-height:1.45;color:var(--faint)}
  .gist{margin:.4rem 0 0;font-size:1rem;line-height:1.5;color:var(--muted)}
  .pending .body h3{color:var(--muted)}
  .date{font-family:var(--mono);font-size:.8125rem;color:var(--muted);white-space:nowrap;padding-top:.3rem;font-variant-numeric:tabular-nums}
  .date.tbd{color:var(--faint)}
  .tag{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:.08rem .4rem;border-radius:5px;margin-left:.5rem;vertical-align:1px}
  .tag.cur{color:var(--current);background:var(--current-soft)}

  @media (prefers-reduced-motion:no-preference){

  }
  footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.875rem;line-height:1.5;color:var(--faint)}
  @media(max-width:560px){

<style>
  /* --- data-driven additions (reuse tokens from the main stylesheet) --- */
  :root{--btn-bg:#00267f;--btn-ink:#ffffff}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--btn-bg:#2dd4bf;--btn-ink:#052b26}}

  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.85rem;padding-top:.8rem;border-top:1px solid var(--line)}

  .blockers{margin:0 0 1.6rem;border:1px solid var(--line);border-left:4px solid var(--current-fill);border-radius:12px;background:var(--surface);padding:.9rem 1.05rem}
  .blockers h2{margin:0 0 .55rem;font-size:.75rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--current)}
  .blk{padding:.5rem 0}
  .blk + .blk{border-top:1px solid var(--line)}
  .blk .what{font-weight:700}
  .blk .body2{font-size:1rem;line-height:1.5;color:var(--ink)}
  .blk .since{display:block;margin-top:.25rem;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
  .blk .since a{color:var(--brand);text-decoration:none;font-weight:600}
  .blk .since a:hover{text-decoration:underline}
  .blk .wd{color:var(--current);font-weight:700}

  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .9rem;margin-top:.5rem}
  .owner{display:inline-flex;align-items:center;gap:.38rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .owner i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .ev{font-family:var(--mono);font-size:.75rem;color:var(--accent);text-decoration:none;white-space:nowrap}

  .aging{font-family:var(--mono);font-size:.72rem;color:var(--muted)}

  .nextmove{margin-top:.45rem;font-size:.9rem;line-height:1.45}

</style>

<div id="app" class="wrap" role="main"></div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     DATA  ·  edit this block to add a service or change a step.
     Dates and evidence links are the real values pulled from GitHub #249.
     ========================================================================= */
  var SYNCED_AT = "2026-08-13";                 // when the data was last pulled
  function C(id){ return "https://github.com/govtech-bb/projects/issues/249#issuecomment-" + id; }

  var SERVICE = {
    issue: 249,
    title: "Application for Licence to Operate a Temporary Restaurant",

    createdAt: "2026-06-15",                    // issue opened
    activeFrom: "2026-06-30",                   // focused delivery began (discovery call)
    target: "Going live this sprint"
  };

  // Owner role -> dot colour, drawn from the alpha.gov.bb palette

    "Delivery":    "var(--brand)",

    "Content":     "#a962c7",
    "Department":  "#e8a833",
    "Platform":    "var(--accent-ink)",
    "Comms":       "#ad1157"

  var DEPENDENCIES = [
    {
      what: "Sign-off from the Environmental Health Department",

    {

      ref:  { label:"#250 Officer request form", url:I(250) }

  // status: "done" | "current" | "pending"
  var STAGES = [
    // ---- Understand the service ----
    { n:1, phase:"Understand the service", owner:"Delivery", status:"done", date:"2026-06-15",
      name:"Get the paper form from the department",
      why:"So we start from the real, official form, not from a guess.",
      gist:"We have the official paper form (A14:086) from the Environmental Health Department." },

    { n:2, phase:"Understand the service", owner:"Delivery", status:"done", date:"2026-06-15",
      name:"Log it on GitHub",
      why:"So everything about this form stays in one place.",
      gist:"Ticket #249 opened with what we already know.",
      ev:{ label:"Issue #249", url:SERVICE.url } },

    { n:3, phase:"Understand the service", owner:"Delivery", status:"done", date:"2026-06-18",
      name:"Build a first version with Claude",
      why:"To turn the paper form into a working online draft, fast.",
      gist:"Claude built a first online version from the paper form. A colleague reviewed it and said it was good to go.",
      ev:{ label:"Prototype ready", url:C("4741315967") } },

    { n:4, phase:"Understand the service", owner:"Delivery", status:"done", date:"2026-06-30",
      name:"Meet the department to learn how it works",
      why:"So we understand the real process, from the people who run it.",
      gist:"Met the Environmental Health Department on 30 June and mapped how the whole thing works.",
      ev:{ label:"Meeting notes", url:C("4863977437") } },

    { n:5, phase:"Understand the service", owner:"Delivery", status:"done", date:"2026-07-06",
      name:"Fill in the discovery questions",
      why:"To capture the details each form needs: where it goes, how fast, and who handles it.",
      gist:"We sent our questions and the draft; the department answered them. We now know which polyclinic each application goes to.",

    { n:6, phase:"Understand the service", owner:"Engineering", status:"done", date:"2026-07-02",
      name:"Check the tricky parts with engineering",
      why:"To make sure we can actually build what we've designed.",
      gist:"Worked out the harder bits with engineering, like uploads that only show when needed, routing each application to the right polyclinic, and file uploads.",
      ev:{ label:"Action points", url:C("4863987872") } },

    { n:7, phase:"Understand the service", owner:"Delivery", status:"done", date:"2026-07-06",
      name:"Walk the department through the draft",
      why:"To catch anything missing before we go further.",
      gist:"Showed the department the draft across meetings on 30 June, 6 and 10 July, and noted the changes they wanted.",
      ev:{ label:"Meeting (6 Jul)", url:C("4904610669") } },

    // ---- Write and test the content ----
    { n:8, phase:"Write and test the content", owner:"Content", status:"done", date:"2026-07-09",
      name:"Review the words",
      why:"To make the form clear and easy to read.",
      gist:"Shayla reviewed the start page and the stall-requirements page. We made the wording plainer.",
      ev:{ label:"Content review", url:C("4923511154") } },

    { n:9, phase:"Write and test the content", owner:"Delivery", status:"done", date:"2026-07-08",
      name:"Make the changes",
      why:"So the department's feedback shows up in the form.",
      gist:"Added the legal wording and pricing, and made clear there's no application fee.",
      ev:{ label:"Prototype updated", url:C("4913728461") } },

    { n:10, phase:"Write and test the content", owner:"Delivery", status:"done", date:"2026-08-06",
      name:"Test it with real people",
      why:"To check the form works for the people who'll use it.",
      gist:"Tested with 8 people and the Eunice Gibson Polyclinic. They get about 50 applications a month, rising to 100 to 150 during Crop Over.",
      ev:{ label:"User research", url:C("5208998912") } },

    { n:11, phase:"Write and test the content", owner:"Content", status:"done", date:"2026-08-07",
      name:"Review the words again",
      why:"To fold in the department's latest changes.",
      gist:"The department asked for an inspection on the event day, a licence that lasts 30 days, and to ask where the food is prepared and stored.",
      ev:{ label:"Content changes", url:C("5214355363") } },

    { n:12, phase:"Write and test the content", owner:"Delivery", status:"done", date:"2026-08-10",
      name:"Make the changes again",
      why:"So the form matches what users and the department need.",
      gist:"Added guidance on hygiene, water and waste, plus food-source options. The form now works from start to finish.",
      ev:{ label:"Prototype updated", url:C("5239654562") } },

    // ---- Get it approved ----
    { n:13, phase:"Get it approved", owner:"Engineering", status:"current", date:"2026-08-11", since:"2026-08-11", target:5,
      name:"Engineering check and build",
      why:"A final quality check, then build it properly.",
      gist:"Shannon has made the changes and built the form. It's on the test site, ready to try.",
      ev:{ label:"Ready for testing", url:C("5254109523") },
      next:{ who:"Engineering and Delivery", what:"review the sandbox build" } },

    { n:14, phase:"Get it approved", owner:"Department", status:"pending",
      name:"Final review with the department",
      why:"To walk them through what we found in testing and the finished form.",
      gist:"To be booked with the Chief Environmental Health Officer, once both forms are ready." },

    { n:15, phase:"Get it approved", owner:"Department", status:"pending", since:"2026-08-11", target:7, blocker:true,
      name:"Department signs it off",
      why:"They agree the form is ready to go live.",
      gist:"The Permanent Secretary wants to see the form first. They may also want the paired officer-request form (#250) ready.",
      ev:{ label:"#576 Secure sign-off", url:I(576) },
      next:{ who:"the Environmental Health Department", what:"review the form and sign it off" } },

    // ---- Build and go live ----
    { n:16, phase:"Build and go live", owner:"Engineering", status:"current", date:"2026-08-11", since:"2026-08-11", target:5,
      name:"Build the live form",
      why:"To get it ready to publish on alpha.gov.bb.",
      gist:"Built and connected to the case management system. A test link has been shared with the team.",
      ev:{ label:"Sandbox ready", url:C("5254109523") } },

    { n:17, phase:"Build and go live", owner:"Engineering", status:"pending",
      name:"Hand over to engineering",
      why:"To connect the emails and case management system, then move it to staging.",
      gist:"Still to do: send the application to the polyclinic by email, and finish the wiring.",
      ev:{ label:"#640 Email integration", url:I(640) } },

    { n:18, phase:"Build and go live", owner:"Engineering", status:"current", date:"2026-08-11", since:"2026-08-11", target:5,
      name:"Test it end to end",
      why:"To check the whole form works on the staging site and in the chatbot.",
      gist:"It works on the test site. The full staging test is still to run.",
      ev:{ label:"#641 End-to-end test", url:I(641) } },

    { n:19, phase:"Build and go live", owner:"Platform", status:"pending",
      name:"Show the department how to use it",
      why:"So the polyclinic knows how to use the case management system.",
      gist:"Set up the polyclinic and collect the emails of the people who'll use it. Tracked on #769.",
      ev:{ label:"#710 Ready for external use", url:I(710) } },

    { n:20, phase:"Build and go live", owner:"Delivery", status:"pending",
      name:"Go live",
      why:"Publish the form on alpha.gov.bb.",
      gist:"Aiming for this sprint, once the department signs off.",
      ev:{ label:"#585 Publish / go live", url:I(585) } },

    // ---- After go-live ----
    { n:21, phase:"After go-live", owner:"Comms", status:"pending",
      name:"Tell the Comms team",
      why:"So they can promote it, about 3 days after it goes live.",
      gist:"Not started yet." },

    { n:22, phase:"After go-live", owner:"Delivery", status:"pending",
      name:"Check in after go-live",
      why:"To make sure the form is working as it should.",
      gist:"Not started yet." },

    { n:23, phase:"After go-live", owner:"Delivery", status:"pending",
      name:"Check in at 1, 3 and 6 months",
      why:"To get feedback and check people are using it as we hoped.",
      gist:"Not started yet." },

    { n:24, phase:"After go-live", owner:"Delivery", status:"pending",
      name:"Check in at 12 months",
      why:"To check the form is still useful and up to date.",
      gist:"Not started yet." }
  ];

  /* =========================================================================
     LOGIC  ·  everything below renders from the data above.
     ========================================================================= */
  var MON  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function D(s){ return new Date(s.length <= 10 ? s + "T00:00:00Z" : s); }
  function daysBetween(a,b){ return Math.round((D(b) - D(a)) / 86400000); }
  function fmtShort(s){ var d = D(s); return d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
  function fmtLong(s){ var d = D(s); return d.getUTCDate() + " " + MONL[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
  function plural(n){ return n === 1 ? "" : "s"; }
  function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function weeks(from){ var d = daysBetween(from, SYNCED_AT); return d < 14 ? (d + " day" + plural(d)) : (Math.round(d/7) + " weeks"); }

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

  var doneN    = STAGES.filter(function(s){ return s.status === "done"; }).length;
  var currentN = STAGES.filter(function(s){ return s.status === "current"; }).length;
  var pendingN = STAGES.filter(function(s){ return s.status === "pending"; }).length;
  var current  = STAGES.filter(function(s){ return s.status === "current"; });
  var gate     = STAGES.filter(function(s){ return s.blocker; })[0];
  var nextTwo  = STAGES.filter(function(s){ return s.status === "pending"; }).slice(0, 2);

  var nowText = current.length
    ? current[0].gist + " (steps " + current.map(function(s){ return s.n; }).join(", ") + ")"
    : "All active steps are complete.";
  var waitingText = "Sign-off from the department. " + (gate ? gate.gist : "");
  var nextText = nextTwo.map(function(s){ return s.name; }).join(", then ") + ".";

  function ownerHTML(role){
    var c = OWNERS[role] || "var(--muted)";
    return '<span class="owner"><i style="background:' + c + '"></i>' + esc(role) + "</span>";
  }
  function evHTML(ev){
    if(!ev) return "";
    return '<a class="ev" href="' + ev.url + '" target="_blank" rel="noopener">' + esc(ev.label) + " ↗</a>";
  }
  function agingHTML(s){
    if(!s.since) return "";
    var d = daysBetween(s.since, SYNCED_AT);
    var over = s.target && d > s.target;
    var label = s.status === "current" ? "in progress" : "waiting";
    var extra = over ? " · overdue" : (s.target ? " of " + s.target + " day target" : "");
    return '<span class="aging' + (over ? " over" : "") + '">' + label + " " + d + " day" + plural(d) + esc(extra) + "</span>";
  }

  function stageHTML(s){
    var srStatus = s.status === "done" ? "Done" : (s.status === "current" ? "In progress" : "To do");
    var node = '<span class="node"><i>' + (s.status === "done" ? CHECK : "") + "</i></span>";
    var tag  = s.status === "current" ? '<span class="tag cur">in progress</span>' : "";
    var dateCell = s.date ? '<div class="date">' + fmtShort(s.date) + "</div>" : '<div class="date tbd">To do</div>';
    var meta = '<div class="meta">' + ownerHTML(s.owner) + evHTML(s.ev) + agingHTML(s) + "</div>";
    var nextMove = s.next ? '<p class="nextmove"><b>Next move:</b> ' + esc(s.next.who) + " to " + esc(s.next.what) + ".</p>" : "";
    return '<li class="stage ' + s.status + '"><span class="num">' + (s.n < 10 ? "0" : "") + s.n + "</span>" +
      node +
      '<div class="body"><span class="sr">' + srStatus + '. </span><h3>' + esc(s.name) + tag + "</h3>" +
      '<p class="why">' + esc(s.why) + "</p>" +
      '<p class="gist">' + esc(s.gist) + "</p>" +
      meta + nextMove + "</div>" +
      dateCell + "</li>";
  }

  function meterHTML(){
    return '<div class="meter" aria-hidden="true">' + STAGES.map(function(s){
      var cls = s.status === "done" ? "done" : (s.status === "current" ? "current" : "");
      return "<span" + (cls ? ' class="' + cls + '"' : "") + "></span>";
    }).join("") + "</div>";
  }

  function consoleHTML(){
    return '<section class="console">' +
      '<div class="top">' +
        '<a class="ref" href="' + SERVICE.url + '" target="_blank" rel="noopener">GH&nbsp;#' + SERVICE.issue + "</a>" +
        '<span class="svc">' + esc(SERVICE.title) + "</span>" +
        '<span class="pill live">' + esc(SERVICE.target) + "</span>" +
      "</div>" +
      '<div class="timing">' +
        '<div class="stat"><span class="lab">On GitHub</span><span class="big">' + weeks(SERVICE.createdAt) + '</span><span class="sub">logged ' + fmtLong(SERVICE.createdAt) + "</span></div>" +
        '<div class="stat"><span class="lab">Active work</span><span class="big">' + weeks(SERVICE.activeFrom) + '</span><span class="sub">started ' + fmtLong(SERVICE.activeFrom) + " · discovery call</span></div>" +
      "</div>" +
      meterHTML() +
      '<p class="sr">' + doneN + " of " + STAGES.length + " steps done, " + currentN + " in progress.</p>" +
      '<div class="legend">' +
        '<span class="key"><span class="swatch sw-done"></span><b>' + doneN + "</b> done</span>" +
        '<span class="key"><span class="swatch sw-cur"></span><b>' + currentN + "</b> in progress</span>" +
        '<span class="key"><span class="swatch sw-pend"></span><b>' + pendingN + "</b> still to do</span>" +
        '<span class="key" style="color:var(--faint)">out of ' + STAGES.length + " steps</span>" +
      "</div>" +
      '<dl class="focus">' +
        "<dt>Now</dt><dd>" + esc(nowText) + "</dd>" +
        '<dt>Waiting on</dt><dd class="gate">' + esc(waitingText) + "</dd>" +
        "<dt>Next</dt><dd>" + esc(nextText) + "</dd>" +
      "</dl>" +
      '<div class="toolbar">' +
        '<span class="synced">Last synced <b>' + fmtLong(SYNCED_AT) + "</b> · from GitHub #" + SERVICE.issue + " and Slack</span>" +
        '<button class="copybtn" id="copyBtn" type="button">Copy update</button>' +
      "</div>" +
    "</section>";
  }

  function blockersHTML(){
    if(!DEPENDENCIES.length) return "";
    return '<section class="blockers"><h2>Blocking go-live</h2>' + DEPENDENCIES.map(function(d){
      var wd = daysBetween(d.since, SYNCED_AT);
      return '<div class="blk">' +
        '<div class="body2"><span class="what">' + esc(d.what) + (d.who ? ": " + esc(d.who) : "") + ".</span> " + esc(d.note) + "</div>" +
        '<span class="since"><span class="wd">' + wd + " day" + plural(wd) + "</span> · since " + fmtShort(d.since) +
          (d.ref ? ' · <a href="' + d.ref.url + '" target="_blank" rel="noopener">' + esc(d.ref.label) + " ↗</a>" : "") +
        "</span>" +
      "</div>";
    }).join("") + "</section>";
  }

  function phasesHTML(){
    var order = [];
    STAGES.forEach(function(s){ if(order.indexOf(s.phase) === -1) order.push(s.phase); });
    return order.map(function(phase){
      return '<p class="phase">' + esc(phase) + '</p><ol class="line">' +
        STAGES.filter(function(s){ return s.phase === phase; }).map(stageHTML).join("") +
      "</ol>";
    }).join("");
  }

  function footerHTML(){
    return "<footer>This page is built from live data in GitHub issue #" + SERVICE.issue +
      ", with each completed step linked to the comment or sub-issue that proves it. Dates and progress come from the issue; the steps follow our form intake process. Last synced " +
      fmtLong(SYNCED_AT) + ". Re-sync to refresh.</footer>";
  }

  var out =
    '<div class="brand"><span class="dot"></span><h1>Super Delivery Manager</h1></div>' +
    '<p class="eyebrow">One service, from the first form to going live · built from GitHub #' + SERVICE.issue + "</p>" +
    consoleHTML() +
    blockersHTML() +
    phasesHTML() +
    footerHTML();

  document.getElementById("app").innerHTML = out;
  document.title = "Super Delivery Manager: #" + SERVICE.issue + " " + SERVICE.title;

  /* ---- Copy update: plain text for a weeknote or Slack post ---- */
  function buildUpdate(){
    return SERVICE.title + " (#" + SERVICE.issue + "), delivery update as of " + fmtLong(SYNCED_AT) + "\n" +
      "Progress: " + doneN + " of " + STAGES.length + " steps done.\n" +
      "Now: " + nowText + "\n" +
      "Waiting on: " + waitingText + "\n" +
      "Next: " + nextText + "\n" +
      SERVICE.url;
  }

  var btn = document.getElementById("copyBtn");
  btn.addEventListener("click", function(){
    var text = buildUpdate();
    function flag(ok){
      if(ok){
        btn.textContent = "Copied ✓";
        btn.classList.add("ok");
        setTimeout(function(){ btn.textContent = "Copy update"; btn.classList.remove("ok"); }, 1800);
      } else if(!document.getElementById("manualCopy")){
        var ta = document.createElement("textarea");
        ta.id = "manualCopy"; ta.className = "manual"; ta.readOnly = true; ta.rows = 6; ta.value = text;
        btn.parentNode.parentNode.appendChild(ta);
        ta.focus(); ta.select();
      }
    }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
      document.body.removeChild(ta);
      flag(ok);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ flag(true); }, fallback);
    } else {
      fallback();
    }
  });
})();
</script>
